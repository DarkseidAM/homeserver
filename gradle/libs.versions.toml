kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
docker-java = { module = "com.github.docker-java:docker-java", version.ref = "docker-java" }
docker-java-transport-httpclient = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "docker-java" }
